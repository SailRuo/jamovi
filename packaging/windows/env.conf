; X-Stat Windows layout env.conf (paths relative to exe directory = bin/)
; Do NOT set JAMOVI_NETWORK_SANDBOX=1 for portable runs outside Program Files
; (Electron NetworkServiceSandbox cannot read the app -> blank window).
[ENV]
JAMOVI_HOME=..
JAMOVI_MODULES_PATH=../Resources/modules
JAMOVI_CLIENT_PATH=../Resources/client
JAMOVI_VERSION_PATH=../Resources/jamovi/version
JAMOVI_EXAMPLES_PATH=../Resources/examples
JAMOVI_SERVER_CMD=../Frameworks/Python/python.exe -u -m jamovi.server 0 --slave
JAMOVI_R_VERSION=4.6.1-x64
